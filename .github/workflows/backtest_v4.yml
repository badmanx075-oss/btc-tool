name: backtest_v4

on:
  workflow_dispatch:
    inputs:
      days:
        description: "History days"
        default: "730"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests pandas numpy

      - name: Backtest
        run: python backtest_v4.py ${{ github.event.inputs.days }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Save
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add backtest_v4_results.json
          git diff --cached --quiet || (git commit -m "backtest v4" && git pull --rebase && git push)
