name: backtest_v3
on:
  workflow_dispatch:
    inputs:
      days: {description: "History days", default: "365"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy
      - name: Backtest
        run: python backtest_v3.py ${{ github.event.inputs.days }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Save
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add backtest_v3_results.json params.json 2>/dev/null || git add backtest_v3_results.json
          git diff --cached --quiet || (git commit -m "backtest" && git push)
