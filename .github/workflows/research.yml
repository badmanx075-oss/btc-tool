name: research

on:
  workflow_dispatch:
    inputs:
      days:
        description: "History days"
        default: "2000"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests pandas numpy

      - name: Move statistics
        run: python move_stats.py ${{ github.event.inputs.days }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Exit-policy backtest (V6)
        run: python backtest_v6.py ${{ github.event.inputs.days }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Full scorecard (V7)
        run: python backtest_v7.py ${{ github.event.inputs.days }}

      - name: Save
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add move_stats.json backtest_v6_results.json backtest_v7_results.json
          git diff --cached --quiet || (git commit -m "research" && git pull --rebase && git push)
