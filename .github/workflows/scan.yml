name: scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      chained:
        description: "set by the previous run (no 'Bot connected' message)"
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: scan

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Remember start time
        run: echo "START_TS=$(date +%s)" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests pandas numpy

      - name: Run worker
        run: timeout -s KILL 20400 python -u worker.py   # -u: log live; hard-kill after 5h40m so a hang can never block the chain
        env:
          PYTHONUNBUFFERED: "1"
          LOOP_MINUTES: "330"
          CHAINED: ${{ github.event.inputs.chained }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}

      - name: Save state
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          for f in state.json trade_history.json config.json; do          # never commit a half-written JSON (run killed mid-write): restore the last good copy instead
            if [ -f "$f" ] && ! python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" 2>/dev/null; then echo "BROKEN $f, restoring last committed copy"; rm -f "$f.tmp"; git checkout -- "$f"; fi
          done
          rm -f *.tmp
          for f in state.json market_log.csv flow_log.csv config.json trade_history.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "state"
          for i in 1 2 3 4; do
            if git pull --rebase --autostash && git push; then echo "saved"; exit 0; fi
            echo "push attempt $i failed, retrying"; git rebase --abort 2>/dev/null || true; sleep $((i * 4))
          done
          echo "could not push state (will be saved by the next run)"; exit 0

      - name: Start the next run right away (GitHub cron is unreliable)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( $(date +%s) - ${START_TS:-0} )) -gt 600 ]; then gh workflow run scan.yml --ref "${GITHUB_REF_NAME}" -f chained=true && echo "next run queued"; else echo "run was short, not chaining (cron will start the next one)"; fi
