name: scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests pandas numpy

      - name: Run worker
        run: python worker.py
        env:
          LOOP_MINUTES: "330"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}

      - name: Save state
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          for f in state.json market_log.csv flow_log.csv config.json trade_history.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "state"
          for i in 1 2 3 4; do
            if git pull --rebase --autostash && git push; then echo "saved"; exit 0; fi
            echo "push attempt $i failed, retrying"; git rebase --abort 2>/dev/null || true; sleep $((i * 4))
          done
          echo "could not push state (will be saved by the next run)"; exit 0
