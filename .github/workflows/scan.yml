name: scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests pandas numpy

      - name: Run worker
        run: python worker.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}

      - name: Save state
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add state.json
          if [ -f market_log.csv ]; then git add market_log.csv; fi
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
